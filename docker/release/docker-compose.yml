services:
  alphaphage:
    image: ghcr.io/b-phage/alphaphage:ci-latest
    platform: linux/amd64
    container_name: alphaphage_demo
    volumes:
      # # This maps the local folder to the container folder
      # # Format: HOST_PATH : CONTAINER_PATH
      # # The ':ro' flag prevents the container from modifying these
      # - ./Project_Demo_Data/databases:/app/databases:ro
      # - ./Project_Demo_Data/models:/app/models:ro

      # # --- USER CONTROLLED (Read-Write) ---
      # # This is where the user drops their input files
      # - ./user_inputs:/app/inputs

      # Hack to test locally without google
      # assuming run from inside of the Code directory
      # Format: HOST_PATH : CONTAINER_PATH
      # The ':ro' flag prevents the container from modifying these
      - ./databases/hmm_inf:/app/databases/hmm
      - ./databases/inference/TransformerX_v1_ep27_20260401:/app/inference/TransformerX_v1_ep27_20260401

      # This is where the user drops their input files
      - ./databases/inference/data/sequence_data:/app/databases/inference/data/sequence_data

      # This is where the user gets the results
      - ./databases/inference/output:/app/databases/inference/output

      # --- PERSISTENCE (Read-Write) ---
      # Stores the mamba env so it doesn't need to be rebuilt every time
      # Remove the './' so it becomes a named volume
      - mamba_envs:/opt/conda/envs

    deploy:
      resources:
        limits:
          cpus: '4'         # Max number of CPU cores the container can use
          memory: 8G        # Max RAM the container can grab
        reservations:
          memory: 2G        # Minimum RAM guaranteed to the container

    stdin_open: true
    tty: true
    working_dir: /app/code
    entrypoint: /bin/bash

volumes:
  mamba_envs:
    name: alphaphage_persistent_envs
