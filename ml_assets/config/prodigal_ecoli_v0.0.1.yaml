  summary_tbl:      "hmm_pfam_summary"

  hmm_fasta_dir:    "ml_assets/data/processed/bacteria/hmm_fasta"

msa_config:
  split_hmm_dir:    "../databases/hmm/pfam/v38.0/split"
  msa_csa_dir:      "ml_assets/data/processed/bacteria/msa_csa"
