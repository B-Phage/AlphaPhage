self_path: "ml_assets/config/prodigal_phage_v0.0.1.yaml"

general:
  lst_genomes:      ["409_P1", "409_P3", "409_P8"]        # optional whitelist of genomes, useful for testing
  code_version:     "prodigal-gv-v1.0"
  name:             "phage"

prodigal_config:
  checkpoint:       null
  genome_dir:       "ml_assets/data/sequence_data/phage" #"../databases/production/sequence_data/phage"
  proteins_dir:     "ml_assets/data/processed/phage/proteins"

hmm_config:
  hmm_multifile:    "../databases/hmm/pharokka_v1.4.0_databases/all_phrogs.h3m"
  annotations:      "../databases/hmm/pharokka_v1.4.0_databases/phrog_annot_v4.tsv"
  hmm_scan_method:  "phrogs"
  sql_tbl_sufix:    ""
  min_bit_score:    50

  hmm_scan_dir:     "ml_assets/data/processed/phage/hmm_scan"
  data_lake:        "ml_assets/data/processed/phage/hmm_scan_lake"
  duckdb:           "../databases/production/duckdb/proteins.duckdb"
  db_fingerprint:   "ml_assets/data/artifacts/hmm_phrog_summary.fingerprint"
  summary_tbl:      "hmm_phrog_summary"

  hmm_fasta_dir:    "ml_assets/data/processed/phage/hmm_fasta"


msa_config:
  split_hmm_dir:    "../databases/hmm/pharokka_v1.4.0_databases/split"
  msa_csa_dir:      "ml_assets/data/processed/phage/msa_csa"
