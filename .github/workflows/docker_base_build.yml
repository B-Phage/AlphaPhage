name: 🐳 Build and Verify Docker Image

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main] # Also build on merge to keep ci-latest up to date

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v4

      # 1. Build the "Skeleton" stage first.
      # This is the small image (~300MB) we actually want to ship to users.
      - name: 🐳 Build Skeleton Image
        run: |
          docker build \
            --target skeleton \
            -t myproject:skeleton \
            -f docker/base/Dockerfile .

      # 2. Build the "Tester" stage.
      # This inherits from skeleton and runs 'make setup-*-pkgs'.
      # If this step fails, it means your environment.yml or Makefile is broken.
      - name: 🏗️ Build Tester Image (Heavy)
        run: |
          docker build \
            --target tester \
            -t myproject:tester \
            -f docker/base/Dockerfile .

      # 3. Run Verification Tests inside the heavy tester image.
      - name: 🧪 Run Unit & Integration Tests
        run: |
          docker run --rm myproject:tester make test
          docker run --rm myproject:tester make test-int

      # 4. Prepare Naming Variables for GHCR
      - name: 🏷️ Set image variables
        run: |
          IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_ENV
          echo "FULL_SHA=${{ github.sha }}" >> $GITHUB_ENV
          echo "SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_ENV

      # 5. Log in to GitHub Container Registry
      - name: 🔑 Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 6. Tag and Push ONLY the Skeleton image.
      # We do NOT push the 'tester' image to save space and bandwidth.
      - name: 🚀 Push Skeleton Image to GHCR
        run: |
          # Use the skeleton image as the source for all tags
          IMAGE_PATH="ghcr.io/${{ env.IMAGE_NAME }}"

          docker tag myproject:skeleton ${IMAGE_PATH}:ci-${{ env.FULL_SHA }}
          docker tag myproject:skeleton ${IMAGE_PATH}:ci-${{ env.SHORT_SHA }}
          docker tag myproject:skeleton ${IMAGE_PATH}:ci-latest

          docker push ${IMAGE_PATH}:ci-${{ env.FULL_SHA }}
          docker push ${IMAGE_PATH}:ci-${{ env.SHORT_SHA }}
          docker push ${IMAGE_PATH}:ci-latest

          # Special tag for PRs
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            docker tag myproject:skeleton ${IMAGE_PATH}:pr-${{ github.event.pull_request.number }}
            docker push ${IMAGE_PATH}:pr-${{ github.event.pull_request.number }}
          fi
