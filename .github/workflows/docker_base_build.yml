name: 🐳 Build Docker image

on:
  pull_request:
    branches: [main, dev]

jobs:
  build-test-image:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v4

      - name: 🐳 Build Docker image
        run: |
          docker build -t myproject:ci -f docker/base/Dockerfile .

      # Run unit tests inside container
      - name: 🧪 Run unit tests
        run: |
          docker run --rm myproject:ci make test

      # Run integration tests inside container
      - name: 🧪 Run integration tests
        run: |
          docker run --rm myproject:ci make test-int

      # Save image as artifact
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Tag Docker image
        run: |
          # Immutable tag (exact build)
          docker tag myproject:ci ghcr.io/${{ github.repository }}:ci-${{ github.sha }}

          # Human-readable rolling tag
          docker tag myproject:ci ghcr.io/${{ github.repository }}:ci-latest

          # Optional: PR-specific tag (only if PR event exists)
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            docker tag myproject:ci ghcr.io/${{ github.repository }}:pr-${{ github.event.pull_request.number }}
          fi

      - name: Push Docker image
        run: |
          docker push ghcr.io/${{ github.repository }}:ci-${{ github.sha }}
          docker push ghcr.io/${{ github.repository }}:ci-latest

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            docker push ghcr.io/${{ github.repository }}:pr-${{ github.event.pull_request.number }}
          fi
