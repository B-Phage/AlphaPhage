name: 🐳 Build Docker image

on:
  pull_request:
    branches: [main, dev]

jobs:
  build-test-image:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v4

      - name: 🐳 Build Docker image
        run: |
          docker build -t myproject:ci -f docker/base/Dockerfile .

      # Run unit tests inside container
      - name: 🧪 Run unit tests
        run: |
          docker run --rm myproject:ci make test

      # Run integration tests inside container
      - name: 🧪 Run integration tests
        run: |
          docker run --rm myproject:ci make test-int

      # Save image as artifact
      - name: Set image variables
        run: |
          # Lowercase repo name for GHCR
          IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')

          # Full SHA
          FULL_SHA=${{ github.sha }}

          # Short SHA (first 7 chars)
          SHORT_SHA=$(echo $FULL_SHA | cut -c1-7)

          echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_ENV
          echo "FULL_SHA=$FULL_SHA" >> $GITHUB_ENV
          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Tag Docker image
        run: |
          # Full SHA (immutable, exact)
          docker tag myproject:ci ghcr.io/${IMAGE_NAME}:ci-${FULL_SHA}

          # Short SHA (human-friendly)
          docker tag myproject:ci ghcr.io/${IMAGE_NAME}:ci-${SHORT_SHA}

          # Rolling tag
          docker tag myproject:ci ghcr.io/${IMAGE_NAME}:ci-latest

          # PR tag (if applicable)
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            docker tag myproject:ci ghcr.io/${IMAGE_NAME}:pr-${{ github.event.pull_request.number }}
          fi

      - name: Push Docker image
        run: |
          docker push ghcr.io/${IMAGE_NAME}:ci-${FULL_SHA}
          docker push ghcr.io/${IMAGE_NAME}:ci-${SHORT_SHA}
          docker push ghcr.io/${IMAGE_NAME}:ci-latest

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            docker push ghcr.io/${IMAGE_NAME}:pr-${{ github.event.pull_request.number }}
          fi
