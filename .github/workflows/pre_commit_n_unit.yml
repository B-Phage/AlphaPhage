name: 🧩🚨 Unit Tests & Pre-Commit Checks

on:
  push:
    branches-ignore: ['archive', 'badges2']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.10' }
      - uses: pre-commit/action@v3.0.1

  test:
    needs: linting
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # # These folder names must match your /packages/ directory
        # package: [utils, orchestration, preprocessing, training, dataloaders]
        include:
          ## No unit test for orchestration package for now
          # - env_name: root_dev
          #   env_file: conda_envs/root_dev.yml
          #   packages: "utils orchestration"

          ## No unit test for preprocessing package for now
          # - env_name: preprocessing
          #   env_file: conda_envs/preprocessing.yml
          #   packages: "preprocessing"

          - env_name: training
            env_file: conda_envs/training.yml
            packages: "training dataloaders"

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      # - name: 🔥 Heavy Duty Disk Cleanup
      #   run: |
      #     sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      #     docker system prune -af

      # - name: 🏗️ Generate Environment Files (via Makefile)
      #   run: |
      #     make setup-all

      - name: 🐍 Setup Micromamba
        uses: mamba-org/setup-micromamba@v1
        with:
          # Points to the file your Makefile just generated
          environment-file: ${{ matrix.env_file }}
          environment-name: ${{ matrix.env_name }}
          cache-environment: true
          # Cache key is now based on the SPECIFIC env file, not the package folder
          cache-environment-key: ${{ runner.os }}-mamba-${{ matrix.env_name }}-${{ hashFiles(matrix.env_file) }}

      - name: 🛠️ Editable Install
        shell: bash -l {0}
        run: |
          ## Ensure the package is linked to the newly created env
          ## pip install -e ./packages/${{ matrix.package }}
          # Iterate over the space-separated list of packages for this environment
          for pkg in ${{ matrix.packages }}; do
            echo "--- Processing Package: $pkg ---"

            # 1. Editable Install
            pip install -e ./packages/$pkg

            # 2. Run Unit Tests
            pytest tests/unit/test_${pkg}.py \
              --cov=packages/${pkg} \
              --cov-report=xml:coverage-${pkg}.xml \
              --cov-report=html:htmlcov-${pkg} \
              --cov-report=json:coverage-${pkg}.json \
              --cov-report=term
          done

      # - name: ⬆️ Upload Coverage Artifacts
      #   uses: actions/upload-artifact@v4
      #   with:
      #   # This uploads all htmlcov folders created in this job
      #     name: html-coverage-${{ matrix.env_name }}
      #     path: htmlcov-*

      # # - name: ⬆️ Upload Coverage Report
      # #   uses: actions/upload-artifact@v4
      # #   with:
      # #     name: html-coverage-report
      # #     path: htmlcov/

      # - name: 💯 Extract total coverage
      #   id: extract
      #   run: |
      #     COV=$(python -c "import json; print(json.load(open('coverage.json'))['totals']['percent_covered_display'])")
      #     echo "coverage=$COV" >> $GITHUB_OUTPUT

      - name: ⬆️ Upload Coverage Artifacts
        uses: actions/upload-artifact@v4
        with:
          # This correctly uses the wildcard * to find all package folders
          name: html-coverage-${{ matrix.env_name }}
          path: htmlcov-*

      # REMOVE the "Upload Coverage Report" step that was looking for htmlcov/
      # It is redundant now that you have the step above.

      - name: 💯 Extract total coverage
        id: extract
        shell: bash -l {0}
        run: |
          # We need to find one of the generated JSON files.
          # This line picks the last one in the list (e.g., coverage-dataloaders.json)
          LATEST_JSON=$(ls coverage-*.json | tail -n 1)

          echo "Using $LATEST_JSON for badge"
          COV=$(python -c "import json; print(json.load(open('$LATEST_JSON'))['totals']['percent_covered_display'])")
          echo "coverage=$COV" >> $GITHUB_OUTPUT


      - name: 🎖️ Generate SVG badge
        run: |
          # 1. Setup
          mkdir -p badges

          # Change the path to the bash script
          BASH_SCRIPT_PATH="tests/utils/create_badge.sh"

          # Make sure the script is executable
          chmod +x "$BASH_SCRIPT_PATH"

          # 2. Determine safe branch name
          BRANCH_SAFE="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          BRANCH_SAFE="${BRANCH_SAFE//\//_}"

          # 3. Get Coverage value
          COV="${{ steps.extract.outputs.coverage }}"

          # 4. Define the output file path
          BADGE_FILE="badges/coverage-${BRANCH_SAFE}.svg"

          # 5. Call the bash interface using its full relative path
          "$BASH_SCRIPT_PATH" "coverage" "$BRANCH_SAFE" "$COV" "$BADGE_FILE"

      - name: ⬆️ Commit and push SVG badge
        run: |
          BRANCH_SAFE="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          BRANCH_SAFE="${BRANCH_SAFE//\//_}"  # replace slashes with underscores
          BADGE_FILE="coverage-${BRANCH_SAFE}.svg"

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          # The -f flag ignores the local changes to coverage.json and dvc.yaml
          git fetch origin badges2
          git checkout -f badges2
          git reset --hard origin/badges2

          cp badges/${BADGE_FILE} .

          git add ${BADGE_FILE}
          git commit -m "Update coverage badge for branch ${BRANCH_SAFE}: ${{ steps.extract.outputs.coverage }}%" || echo "No changes"
          git push origin badges2 --force
