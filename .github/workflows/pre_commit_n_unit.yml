name: 🧩🚨 Unit Tests & Pre-Commit Checks

on:
    # Run on every push to a branch
  push:
    # Use branches-ignore to exclude specific branches
    branches-ignore:
      - 'archive'          # Example: Ignore a specific archive branch
      - 'badges2'           # Tests should never be merged into badges anyway
  # Run when a Pull Request is opened or updated
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write  # needed to push to badges branch

jobs:
  linting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 🏃 Run Pre-Commit Checks
        uses: pre-commit/action@v3.0.1
        id: run_hooks
        continue-on-error: true

      - name: ❌🪲 Show Modified Files and Differences
        if: steps.run_hooks.outcome == 'failure'
        run: |
          echo "Hooks failed because they modified these files:"
          git status --porcelain
          echo "--- Full Git Diff ---"
          git diff

      - name: ☠️ Check (Fail Job if Hooks Modified Files)
        if: steps.run_hooks.outcome == 'failure'
        run: |
          echo "Failing job because pre-commit checks failed or modified files."
          exit 1

  # parallel, but with a more structured matrix to handle multiple packages and their specific test files
  test:
    needs: linting
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - env_name: training
            env_file: conda_envs/training.yml
            # List of folders in ./packages/ to pip install
            install_packages: "training dataloaders models utils"
            test_files: >-
              tests/unit/test_transformer_archspecs.py
              tests/unit/test_transformer_classifier.py
              tests/unit/test_transformer_module.py
              tests/unit/test_dataloaders.py

          - env_name: preprocessing
            env_file: conda_envs/preprocessing.yml
            install_packages: "utils orchestration hmm storage_io setup_workflows"
            test_files: "all_remaining"

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Micromamba
        uses: mamba-org/setup-micromamba@v1
        with:
          environment-file: ${{ matrix.env_file }}
          environment-name: ${{ matrix.env_name }}
          cache-environment: true

      - name: 🛠️ Install & Run Tests
        shell: bash -l {0}
        run: |
          # 1. Install listed packages in editable mode
          for pkg in ${{ matrix.install_packages }}; do
            echo "--- Installing Package: $pkg ---"
            pip install -e ./packages/$pkg
          done

          # 2. Run Tests with Coverage
          # We use the specific list of files provided in the matrix
          echo "--- Running Tests for ${{ matrix.env_name }} ---"
          export PYTHONPATH=$PYTHONPATH:$(pwd)/packages
          export KMP_DUPLICATE_LIB_OK=TRUE

          if [ "${{ matrix.test_files }}" = "all_remaining" ]; then
            # EXCLUSION LOGIC: Find all unit tests EXCEPT those handled by 'training'
            EXCLUDE=(tests/unit/test_transformer_archspecs.py tests/unit/test_transformer_classifier.py tests/unit/test_transformer_module.py tests/unit/test_dataloaders.py)
            FIND_CMD="find tests/unit -name 'test_*.py'"
            for f in "${EXCLUDE[@]}"; do FIND_CMD+=" ! -path '$f'"; done
            TARGETS=$(eval $FIND_CMD | tr '\n' ' ')
          else
            TARGETS="${{ matrix.test_files }}"
          fi

          # 3. Execution
          # We use pytest instead of unittest to support function-based tests.
          # We disable the internal coverage plugin (-p no:cov) and clear config flags (-o "addopts=")
          # to prevent conflicts with the manual coverage run command.
          COVERAGE_FILE=.coverage.${{ matrix.env_name }} coverage run --source=packages \
            -m pytest -v -p no:cov -o "addopts=" $TARGETS

      - name: 📤 Upload Coverage Data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data-${{ matrix.env_name }}
          path: .coverage.${{ matrix.env_name }}

  coverage-summary:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with: { python-version: '3.10' }

      - name: 📥 Download All Data
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-data-*
          merge-multiple: true

      - name: 📊 Combine & Enforcement
        id: final_cov
        run: |
          pip install coverage
          # Merges the matrix results and applies [paths] mapping from .coveragerc
          coverage combine .coverage.*
          coverage report -m

          # Extract percentage and check threshold
          PERCENT=$(coverage report | grep TOTAL | awk '{print $NF}' | sed 's/%//')
          echo "TOTAL_COV=$PERCENT" >> $GITHUB_OUTPUT

          if [ "$PERCENT" -lt 90 ]; then
            echo "❌ Coverage ($PERCENT%) is below 90% threshold!"
            # We don't exit 1 yet so we can still push the "failing" badge
          fi

      - name: 🎖️ Generate Combined Badge
        run: |
          mkdir -p badges
          BASH_SCRIPT_PATH="tests/utils/create_badge.sh"
          chmod +x "$BASH_SCRIPT_PATH"
          BRANCH_SAFE="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          BRANCH_SAFE="${BRANCH_SAFE//\//_}"
          # Pass the combined coverage percentage to the badge generator
          "$BASH_SCRIPT_PATH" "coverage" "$BRANCH_SAFE" "${{ steps.final_cov.outputs.TOTAL_COV }}" "badges/coverage-${BRANCH_SAFE}.svg"

      - name: ⬆️ Commit and push SVG badge
        run: |
          # Push to the badges branch to update the README status
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git fetch origin badges2
          git checkout -f badges2
          git reset --hard origin/badges2
          cp badges/*.svg .
          git add *.svg
          git commit -m "Update combined coverage badge [${{ steps.final_cov.outputs.TOTAL_COV }}%]" || echo "No changes"
          git push origin badges2 --force

      - name: 🚨 Final Gate
        run: |
          # Now we fail the workflow if the percentage was insufficient
          if [ "${{ steps.final_cov.outputs.TOTAL_COV }}" -lt 90 ]; then
            exit 1
          fi
