name: 🧩🚨 Unit Tests & Pre-Commit Checks

on:
  push:
    branches-ignore: ['archive', 'badges2']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.10' }
      - uses: pre-commit/action@v3.0.1

  #parallel, but with a more structured matrix to handle multiple packages and their specific test files
  test:
    needs: linting
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - env_name: training
            env_file: conda_envs/training.yml
            # List of folders in ./packages/ to pip install
            install_packages: "training dataloaders models utils"
            # Specific source folder for coverage tracking
            cov_source: "packages/models,packages/dataloaders"
            # Explicit list of test files
            test_files: >-
              tests/unit/test_transformer_archspecs.py
              tests/unit/test_transformer_classifier.py
              tests/unit/test_transformer_module.py
              tests/unit/test_dataloaders.py

          - env_name: preprocessing
            env_file: conda_envs/preprocessing.yml
            install_packages: "preprocessing"
            cov_source: "packages/preprocessing"
            test_files: >-
              tests/unit/test_a.py
              tests/unit/test_b.py

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: 🐍 Setup Micromamba
        uses: mamba-org/setup-micromamba@v1
        with:
          environment-file: ${{ matrix.env_file }}
          environment-name: ${{ matrix.env_name }}
          cache-environment: true # Set to false to disable caching of the entire environment
          cache-environment-key: ${{ runner.os }}-mamba-${{ matrix.env_name }}-${{ hashFiles(matrix.env_file) }}
          cache-downloads: true # Set to false to force download of packages every time

      - name: 🛠️ Install Packages & Run Tests
        shell: bash -l {0}
        run: |
          # 1. Install listed packages in editable mode
          for pkg in ${{ matrix.install_packages }}; do
            echo "--- Installing Package: $pkg ---"
            pip install -e ./packages/$pkg
          done

          # 2. Run Unittests with Coverage
          # We use the specific list of files provided in the matrix
          echo "--- Running Tests for ${{ matrix.env_name }} ---"
          export PYTHONPATH=$PYTHONPATH:$(pwd)/workflows:$(pwd)/packages
          coverage run --source=${{ matrix.cov_source }} -m unittest ${{ matrix.test_files }}

          # 3. Generate Reports
          coverage report -m
          coverage html -d htmlcov-${{ matrix.env_name }}
          coverage json -o coverage-${{ matrix.env_name }}.json

      - name: ⬆️ Upload Coverage Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: html-coverage-${{ matrix.env_name }}
          path: htmlcov-*

      - name: 💯 Extract Total Coverage
        id: extract
        shell: bash -l {0}
        run: |
          JSON_FILE="coverage-${{ matrix.env_name }}.json"
          COV=$(python -c "import json; print(json.load(open('$JSON_FILE'))['totals']['percent_covered_display'])")
          echo "coverage=$COV" >> $GITHUB_OUTPUT

      # --- Badge Generation Logic (same as before) ---
      - name: 🎖️ Generate SVG Badge
        run: |
          mkdir -p badges
          BASH_SCRIPT_PATH="tests/utils/create_badge.sh"
          chmod +x "$BASH_SCRIPT_PATH"
          BRANCH_SAFE="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          BRANCH_SAFE="${BRANCH_SAFE//\//_}"
          COV="${{ steps.extract.outputs.coverage }}"
          BADGE_FILE="badges/coverage-${BRANCH_SAFE}.svg"
          "$BASH_SCRIPT_PATH" "coverage" "$BRANCH_SAFE" "$COV" "$BADGE_FILE"

      - name: ⬆️ Commit and push SVG badge
        run: |
          # Use the environment name in the badge push to avoid collisions
          BRANCH_SAFE="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          BRANCH_SAFE="${BRANCH_SAFE//\//_}_${{ matrix.env_name }}"
          BADGE_FILE="coverage-${BRANCH_SAFE}.svg"

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git fetch origin badges2
          git checkout -f badges2
          git reset --hard origin/badges2
          cp badges/*.svg .
          git add *.svg
          git commit -m "Update coverage badge for ${{ matrix.env_name }} on ${BRANCH_SAFE}" || echo "No changes"
          git push origin badges2 --force
