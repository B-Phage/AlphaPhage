name: 🚨 Pre-Commit Checks

on:
  # Run on every push to a branch
  push:
    branches:
      - main
      - mlops_setup
  # Run when a Pull Request is opened or updated
  pull_request:
    branches:
      - main

permissions:
  contents: write  # needed to push to badges branch

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4
        # Need to fetch history to allow hooks like commit-msg or detect-secrets to work correctly
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # Match your target Python version

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # Install your main package in editable mode, including test dependencies
          pip install -e ./packages/utils
          pip install pytest pre_commit omegaconf coverage pytest-cov

      - name: 🏃 Run Pre-Commit Checks
        uses: pre-commit/action@v3.0.1 # Use the official action
        # The official action automatically handles:
        # 1. Installing 'pre-commit'
        # 2. Caching the hook environments
        # 3. Running 'pre-commit run --all-files'
        # It will fail the job if any hook fails.
        id: run_hooks # Give the step an ID
        continue-on-error: true

      # Debugging Steps
      - name: ❌🪲 Show Modified Files and Differences
        # We only run this debugging step if the previous step actually failed (i.e., modified files)
        if: ${{ steps.run_hooks.outcome == 'failure' }}
        run: |
          echo "Hooks failed because they modified these files:"
          git status --porcelain # Shows list of modified files (in a machine-readable format)
          echo "--- Full Git Diff ---"
          git diff # Shows exactly what changes were made (missing newlines)

      # FAILURE STEP (Optional, but good practice)
      # If the debugging step passed, but the hooks failed, we fail the job here.
      # You can skip this if you want the action to just run the hooks and always pass.
      - name: ☠️ Check (Fail Job if Hooks Modified Files)
        if: ${{ steps.run_hooks.outcome == 'failure' }}
        run: |
          echo "Failing job because pre-commit checks modified files."
          exit 1

     # Unit tests
      - name: 🧪 Run Unit Tests
        run: |
          PYTHONPATH=./packages pytest tests/ --cov=utils --cov-report=xml --cov-report=term --cov-report=html
          coverage json -o coverage.json
        # You could also use an 'id' and 'continue-on-error' if you want
        # to guarantee the test run even if other steps failed,
        # but generally, if linting fails, tests shouldn't run.

      - name: 💯 Extract total coverage
        id: extract
        run: |
          COV=$(python -c "import json; print(json.load(open('coverage.json'))['totals']['percent_covered_display'])")
          echo "coverage=$COV" >> $GITHUB_OUTPUT

      - name: 🎖️ Generate SVG badge
        run: |
          BRANCH_NAME="${GITHUB_REF_NAME}"
          BADGE_FILE="coverage-${BRANCH_NAME}.svg"
          mkdir -p badges
          COV=${{ steps.extract.outputs.coverage }}

          # Set color based on thresholds
          if (( $(echo "$COV >= 95" | bc -l) )); then COLOR="green"
          elif (( $(echo "$COV >= 85" | bc -l) )); then COLOR="yellow"
          else COLOR="red"
          fi

          # Minimal SVG badge template
          cat <<EOF > badges/$BADGE_FILE
          <svg xmlns="http://www.w3.org/2000/svg" width="110" height="20">
            <linearGradient id="b" x2="0" y2="100%">
              <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
              <stop offset="1" stop-opacity=".1"/>
            </linearGradient>
            <mask id="a">
              <rect width="110" height="20" rx="3" fill="#fff"/>
            </mask>
            <g mask="url(#a)">
              <rect width="60" height="20" fill="#555"/>
              <rect x="60" width="50" height="20" fill="$COLOR"/>
              <rect width="110" height="20" fill="url(#b)"/>
            </g>
            <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="11">
              <text x="30" y="14">coverage</text>
              <text x="85" y="14">${COV}%</text>
            </g>
          </svg>
          EOF

      - name: ⬆️ Commit and push SVG badge
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git fetch origin badges2
          git checkout badges2
          git reset --hard origin/badges2

          cp badges/coverage-${GITHUB_REF_NAME}.svg .

          git add coverage-${GITHUB_REF_NAME}.svg
          git commit -m "Update coverage badge for branch ${GITHUB_REF_NAME}: ${{ steps.extract.outputs.coverage }}%" || echo "No changes"
          git push origin badges2 --force

      # - name: 🏵️ Prepare badge JSON
      #   run: |
      #     BADGE_FILE="coverage-${GITHUB_REF_NAME}.json"
      #     mkdir -p badges
      #     printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}' \
      #       "${{ steps.extract.outputs.coverage }}" \
      #       "$( [ $(echo "${{ steps.extract.outputs.coverage }}"'>'90 | bc -l) ] && echo green || echo red )" \
      #       > badges/$BADGE_FILE
