name: Makefile CI (Linux + WSL)

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

jobs:
  # =========================
  # 🐧 DEV → Ubuntu
  # =========================
  test-linux:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev' || github.base_ref == 'dev'

    steps:
      - uses: actions/checkout@v4

      - name: Install mamba
        run: |
          source $HOME/miniconda/etc/profile.d/conda.sh
          conda install -n base -c conda-forge mamba

      - name: Run Makefile on Ubuntu
        run: |
          set -e

          sudo apt-get update
          sudo apt-get install -y make curl git

          curl -sSLo miniconda.sh https://repo.anaconda.com/miniconda/Miniconda3-latest-Linux-x86_64.sh
          bash miniconda.sh -b -p $HOME/miniconda
          source $HOME/miniconda/etc/profile.d/conda.sh

          conda config --set always_yes yes
          conda update -n base -c defaults conda

          if grep -q osx-arm64 Makefile; then
            sed -i 's/osx-arm64/linux-64/g' Makefile
            sed -i 's/osx-64/linux-64/g' Makefile
          fi

          make setup-preproc-pkgs
          make setup-training-pkgs
          make setup-kaptive-pkgs
          make hooks

  # =========================
  # 🪟 MAIN → Windows + WSL
  # =========================
  # Time consuming CI but the more likely deployment case
  test-wsl:
    runs-on: windows-latest
    if: github.ref == 'refs/heads/main' || github.base_ref == 'main'

    steps:
      - uses: actions/checkout@v4

      - name: Enable WSL
        run: wsl --install -d Ubuntu
        shell: powershell

      - name: Run Makefile in WSL
        run: |
          wsl bash -c "
            set -e

            sudo apt-get update
            sudo apt-get install -y make curl git

            curl -sSLo miniconda.sh https://repo.anaconda.com/miniconda/Miniconda3-latest-Linux-x86_64.sh
            bash miniconda.sh -b -p \$HOME/miniconda
            source \$HOME/miniconda/etc/profile.d/conda.sh

            conda config --set always_yes yes
            conda update -n base -c defaults conda

            if grep -q osx-arm64 Makefile; then
              sed -i 's/osx-arm64/linux-64/g' Makefile
              sed -i 's/osx-64/linux-64/g' Makefile
            fi

            make setup-preproc-pkgs
            make setup-training-pkgs
            make setup-kaptive-pkgs
            make hooks
          "
        shell: powershell
