name: preprocessing
channels:
  - bioconda
  - conda-forge
dependencies:
  - python=3.13
  - prodigal
  - prodigal-gv
  - pyhmmer
  - omegaconf
  - pre_commit
  - pytest
  - coverage
  - pytest-cov
  - tqdm
  - colorlog
  - "dvc[gdrive]"
  - dvc-gdrive
  - funcy
  - "duckdb>=1.1.0"
  - pandas
  - pyarrow # Essential for high-performance Parquet handling (duckdb)
  - types-PyYAML # for pylance and YAML
  - scikit-learn
  - biopython
  - responses
  - types-requests
  - h5py
