  train_model:
    cmd: >
      bash -c 'source ~/miniforge3/etc/profile.d/conda.sh &&
      conda activate training &&
      export PYTHONPATH=$PYTHONPATH:$(pwd)/packages &&
      export PYTHONPATH=$PYTHONPATH:$(pwd)/workflows &&
      export CUDA_VISIBLE_DEVICES="" &&
      python workflows/run_train.py --config params.yaml '
    deps:
    - ml_assets/config/train_v0.0.1.yaml
    outs:
    - ml_assets/data/training/default_run/checkpoints

