# Run with
# dvc update # this brings in the remote raw data
# dvc repro  # this runs all changed piplines, see https://doc.dvc.org/command-reference/repro#options
vars:
  - params.yaml:
      vocab:
  #     version
  #     file
  #     variants_encoding




stages:
# -----------------------------------------------------------------------------
# Dependency Check
# -----------------------------------------------------------------------------

  code_hashes:
  # Hash up front to help stitch DVC and underlying orchestration
  # A package hash is also more convenient to use as a dep than
  # listing multiple interconnected code files

    cmd: >
      bash -c 'source ~/miniforge3/etc/profile.d/conda.sh &&
      conda activate preprocessing &&
      export PYTHONPATH=$PYTHONPATH:$(pwd)/packages &&
      python -u workflows/hash_pipeline_packages.py
      --packages
      packages/hmm
      packages/data_contracts
      packages/utils
      packages/storage_io
      packages/representation
      packages/variants
      workflows/run_kaptive3api.py
      workflows/run_prodigal.py
      workflows/run_hmm_scan_pipeline.py
      workflows/hmm_parquet_to_summary_tbl.py
      workflows/create_msas.py
      workflows/create_msa_variants.py
      workflows/run_train.py
      packages/hmm/msa.py
      packages/hmm/duckdb_io.py
      packages/representation/typing_aggregator.py
      packages/representation/build_model_data.py
      --output-dir ml_assets/data/artifacts/code_hashes '
    deps:
      - packages/hmm
      - packages/data_contracts
      - packages/utils
      - packages/storage_io
      - packages/representation
      - packages/variants
      - workflows/run_prodigal.py
      - workflows/run_kaptive3api.py
      - workflows/run_hmm_scan_pipeline.py
      - workflows/hmm_parquet_to_summary_tbl.py
      - workflows/create_msas.py
      - workflows/create_msa_variants.py
      - workflows/run_train.py
    outs:
      - ml_assets/data/artifacts/code_hashes # whole directory


# -----------------------------------------------------------------------------
# Phage Preprocessing
# -----------------------------------------------------------------------------


  prodigal_phage:
    # required:
    #   dvc add ../databases/production/sequence_data/phage --out ml_assets/data/sequence_data
    #   git add ml_assets/data/sequence_data/phage/.gitignore ml_assets/data/sequence_data/phage.dvc
    cmd: >
      bash -c 'source ~/miniforge3/etc/profile.d/conda.sh &&
      conda activate preprocessing &&
      export PYTHONPATH=$PYTHONPATH:$(pwd)/packages &&
      python -u workflows/run_prodigal.py
      --config "${self_path}"
      --code_hash ml_assets/data/artifacts/code_hashes/run_prodigal.hash '
    deps:
      - ml_assets/data/artifacts/code_hashes/run_prodigal.hash
      - ${prodigal_config.genome_dir}
      - ${self_path}
    vars:
      - ml_assets/config/preprocessing_phage_v1.0.0.yaml
    outs:
      - ${prodigal_config.proteins_dir}_manifest.json
      - ${prodigal_config.proteins_dir}:
          persist: true
      - ml_assets/data/workflow/hashes/prodigal_${general.name}.json:
          persist: true


  hmm_scan_all_phage:
  # dvc add ml_assets/data/workflow/msas
  # git add ml_assets/data/workflow/msas.dvc
    cmd: >
      bash -c 'source ~/miniforge3/etc/profile.d/conda.sh &&
      conda activate preprocessing &&
      export PYTHONPATH=$PYTHONPATH:$(pwd)/packages &&
      python -u workflows/run_hmm_scan_pipeline.py
      --config "${self_path}"
      --code_hash ml_assets/data/artifacts/code_hashes/hmm.hash
      --code_hash ml_assets/data/artifacts/code_hashes/data_contracts.hash
      --code_hash ml_assets/data/artifacts/code_hashes/run_hmm_scan_pipeline.hash
      '
    deps:
      - ml_assets/data/artifacts/code_hashes/run_hmm_scan_pipeline.hash
      - ml_assets/data/artifacts/code_hashes/data_contracts.hash
      - ml_assets/data/artifacts/code_hashes/hmm.hash
      - ${prodigal_config.proteins_dir}_manifest.json
      - ${self_path}
    outs:
      - ${hmm_config.data_lake}_manifest.json
      - ${hmm_config.data_lake}:
          persist: true
      - ml_assets/data/workflow/hashes/hmm_scan_${general.name}.json:
          persist: true
    vars:
      - ml_assets/config/preprocessing_phage_v1.0.0.yaml

  build_phage_hmm_summary:
  # Summarise the parquet lake to optimise the next HMM extraction step
  # Note: This does not rely on any orchestration internally so the code hashes do not need to
  # be passed to hmm_parquet_to_summary_tbl
    cmd: >
      bash -c 'source ~/miniforge3/etc/profile.d/conda.sh &&
      conda activate preprocessing &&
      export PYTHONPATH=$PYTHONPATH:$(pwd)/packages &&
      python -u workflows/hmm_parquet_to_summary_tbl.py
      --config "${self_path}"
      --fingerprint ${hmm_config.db_fingerprint}
      '
    deps:
      - ml_assets/data/artifacts/code_hashes/hmm_parquet_to_summary_tbl.hash
      - ml_assets/data/artifacts/code_hashes/duckdb_io.hash
      - ${hmm_config.data_lake}_manifest.json     # parquet producing stage output
    outs:
    # We are intentionally not tracking the DuckDB table itself in DVC. The parquet lake already has all the info.
      - ${hmm_config.db_fingerprint}
    vars:
      - ml_assets/config/preprocessing_phage_v1.0.0.yaml

  extract_phage_hmm_fastas:
  # if anything changed with the code deps or the db_fingerprint:
  #   DVC will run create_hmm_fastas which wipes the outs folder and the regenerates everything
  # We are still using a manifest here instead of an out folder
  # Which means `dvc add ${hmm_config.hmm_fasta_dir}` needs to be run seperately for tracking
    cmd: >
      bash -c 'source ~/miniforge3/etc/profile.d/conda.sh &&
      conda activate preprocessing &&
      export PYTHONPATH=$PYTHONPATH:$(pwd)/packages &&
      python -u workflows/create_hmm_fastas.py
      --config "${self_path}" '
    deps:
      - ${hmm_config.db_fingerprint}
      - workflows/create_hmm_fastas.py
      - packages/hmm/duckdb_io.py
    outs:
      - ${hmm_config.hmm_fasta_dir}_manifest.json
      - ${hmm_config.hmm_fasta_dir}:
          persist: true
      - ml_assets/data/workflow/hashes/export_${general.name}_hmm_fastas.json:
          persist: true
    vars:
      - ml_assets/config/preprocessing_phage_v1.0.0.yaml

  create_phage_msas:
    cmd: >
      bash -c 'source ~/miniforge3/etc/profile.d/conda.sh &&
      conda activate preprocessing &&
      export PYTHONPATH=$PYTHONPATH:$(pwd)/packages &&
      python -u workflows/create_msas.py
      --config "${self_path}"
      --code_hash ml_assets/data/artifacts/code_hashes/msa.hash
      --code_hash ml_assets/data/artifacts/code_hashes/create_msas.hash
      '
    deps:
      - ml_assets/data/artifacts/code_hashes/create_msas.hash
      - ml_assets/data/artifacts/code_hashes/msa.hash
      - ${hmm_config.hmm_fasta_dir}_manifest.json
    outs:
      - ${msa_config.msa_csa_dir}_manifest.json
      - ${msa_config.msa_csa_dir}:
          persist: true
      - ml_assets/data/workflow/hashes/msa_${general.name}.json:
          persist: true
    vars:
      - ml_assets/config/preprocessing_phage_v1.0.0.yaml

  create_phage_msa_vars:
    cmd: >
      bash -c 'source ~/miniforge3/etc/profile.d/conda.sh &&
      conda activate preprocessing &&
      export PYTHONPATH=$PYTHONPATH:$(pwd)/packages &&
      python -u workflows/create_msa_variants.py
      --config "${self_path}"
      --code_hash ml_assets/data/artifacts/code_hashes/variants.hash
      --code_hash ml_assets/data/artifacts/code_hashes/create_msa_variants.hash
      '
    deps:
      - ml_assets/data/artifacts/code_hashes/variants.hash
      - ml_assets/data/artifacts/code_hashes/create_msa_variants.hash
      - ${msa_config.msa_csa_dir}_manifest.json
      - ${self_path}
    outs:
      - ${msa_var.msa_variant_dir}:
          persist: true
      - ml_assets/data/workflow/hashes/variants_${general.name}.json:
          persist: true
    vars:
      - ml_assets/config/preprocessing_phage_v1.0.0.yaml

  aggregate_phage_variants:
    cmd: >
      bash -c 'source ~/miniforge3/etc/profile.d/conda.sh &&
      conda activate preprocessing &&
      export PYTHONPATH=$PYTHONPATH:$(pwd)/packages &&
      python -m variants.long_table_builder
      -i ${msa_var.msa_variant_dir}/${msa_var.msa_cluster_name}
      -d ${storage.feature_db}
      -t ${features.phage.table_name}
      -s ${vocab.variants_encoding}
      -mp ${storage.feature_db}_phage_manifest.json
      '
    deps:
      - ml_assets/data/artifacts/code_hashes/variants.hash
      - ml_assets/data/artifacts/code_hashes/create_msa_variants.hash
      - ml_assets/data/workflow/hashes/variants_${general.name}.json
      - ${self_path}
    outs:
      - ${storage.feature_db}_phage_manifest.json
    vars:
      - ml_assets/config/preprocessing_phage_v1.0.0.yaml


# -----------------------------------------------------------------------------
# Host Preprocessing
# -----------------------------------------------------------------------------

  kaptive_ecoli:
    vars:
      - ml_assets/config/kaptive3api_v0.0.1.yaml
    cmd: >
      bash -c 'source ~/miniforge3/etc/profile.d/conda.sh &&
      conda activate kaptive3api &&
      export PYTHONPATH=$PYTHONPATH:$(pwd)/packages &&
      python -u workflows/run_kaptive3api.py
      --config "ml_assets/config/kaptive3api_v0.0.1.yaml"
      --code_hash ml_assets/data/artifacts/code_hashes/run_kaptive3api.hash
      '
    deps:
      - ml_assets/data/artifacts/code_hashes/run_kaptive3api.hash
      - ${kaptive_config.genome_dir}
      - ml_assets/config/kaptive3api_v0.0.1.yaml
    outs:
      # - ml_assets/data/processed/bacteria/kaptive_manifest.json
      - ${kaptive_config.kaptive_dir}_manifest.json
      - ${kaptive_config.kaptive_dir}:
          persist: true

  aggregate_serotypes:
    vars:
      - ml_assets/config/kaptive3api_v0.0.1.yaml
    cmd: >
      bash -c 'source ~/miniforge3/etc/profile.d/conda.sh &&
      conda activate preprocessing &&
      export PYTHONPATH=$PYTHONPATH:$(pwd)/packages &&
      python -m representation.typing_aggregator
      -i ${kaptive_config.kaptive_dir}
      -d ${storage.feature_db}
      -t ${features.serotype.table_name}
      -m ${storage.feature_db}_serotypes.json
      '
    deps:
      - ${kaptive_config.kaptive_dir}_manifest.json
      - ml_assets/data/artifacts/code_hashes/representation.hash
    outs:
      - ${storage.feature_db}_serotypes.json

  prodigal_ecoli:
    # NOTE: The input folder can be added in or updated (with -force) from external folders using the `dvc add` command.
    # Example
    #   dvc add ../databases/production/sequence_data/bacteria --out ml_assets/data/sequence_data
    # If it is the first run you need to add two files to git as well:
    #   git add ml_assets/data/sequence_data/bacteria/.gitignore ml_assets/data/sequence_data/bacteria/bacteria.dvc
    cmd: >
      bash -c 'source ~/miniforge3/etc/profile.d/conda.sh &&
      conda activate preprocessing &&
      export PYTHONPATH=$PYTHONPATH:$(pwd)/packages &&
      python -u workflows/run_prodigal.py
      --config "${self_path}"
      --code_hash ml_assets/data/artifacts/code_hashes/run_prodigal.hash
      '
    deps:
      - ml_assets/data/artifacts/code_hashes/run_prodigal.hash
      - ${prodigal_config.genome_dir}
      - ${self_path}
    vars:
      - "ml_assets/config/preprocessing_ecoli_v1.0.0.yaml"
    outs:
      - ${prodigal_config.proteins_dir}_manifest.json
      - ${prodigal_config.proteins_dir}:
          persist: true

  hmm_scan_all_ecoli:
    cmd: >
      bash -c 'source ~/miniforge3/etc/profile.d/conda.sh &&
      conda activate preprocessing &&
      export PYTHONPATH=$PYTHONPATH:$(pwd)/packages &&
      python -u workflows/run_hmm_scan_pipeline.py
      --config "${self_path}"
      --code_hash ml_assets/data/artifacts/code_hashes/hmm.hash
      --code_hash ml_assets/data/artifacts/code_hashes/data_contracts.hash
      --code_hash ml_assets/data/artifacts/code_hashes/run_hmm_scan_pipeline.hash
      '
    deps:
      - ml_assets/data/artifacts/code_hashes/run_hmm_scan_pipeline.hash
      - ml_assets/data/artifacts/code_hashes/data_contracts.hash
      - ml_assets/data/artifacts/code_hashes/hmm.hash
      - ${prodigal_config.proteins_dir}_manifest.json
    outs:
      - ${hmm_config.data_lake}_manifest.json
      - ${hmm_config.data_lake}:
          persist: true
      - ml_assets/data/workflow/hashes/hmm_scan_${general.name}.json:
          persist: true
    vars:
      - ml_assets/config/preprocessing_ecoli_v1.0.0.yaml

  build_ecoli_hmm_summary:
  # Summarise the parquet lake to optimise the next HMM extraction step
    cmd: >
      bash -c 'source ~/miniforge3/etc/profile.d/conda.sh &&
      conda activate preprocessing &&
      export PYTHONPATH=$PYTHONPATH:$(pwd)/packages &&
      python -u workflows/hmm_parquet_to_summary_tbl.py
      --config "${self_path}"
      --fingerprint ${hmm_config.db_fingerprint}
      '
    deps:
      - ml_assets/data/artifacts/code_hashes/hmm_parquet_to_summary_tbl.hash
      - ml_assets/data/artifacts/code_hashes/duckdb_io.hash
      - ${hmm_config.data_lake}_manifest.json     # parquet producing stage output
    outs:
    # We are intentionally not tracking the DuckDB table itself in DVC. The parquet lake already has all the info.
      - ${hmm_config.db_fingerprint}
    vars:
      - ml_assets/config/preprocessing_ecoli_v1.0.0.yaml

  extract_ecoli_hmm_fastas:
    cmd: >
      bash -c 'source ~/miniforge3/etc/profile.d/conda.sh &&
      conda activate preprocessing &&
      export PYTHONPATH=$PYTHONPATH:$(pwd)/packages &&
      python -u workflows/create_hmm_fastas.py
      --config "${self_path}" '
    deps:
      - ${hmm_config.db_fingerprint}
      - workflows/create_hmm_fastas.py
      - packages/hmm/duckdb_io.py
    outs:
      - ${hmm_config.hmm_fasta_dir}_manifest.json
      - ${hmm_config.hmm_fasta_dir}:
          persist: true
      - ml_assets/data/workflow/hashes/export_${general.name}_hmm_fastas.json:
          persist: true
    vars:
      - ml_assets/config/preprocessing_ecoli_v1.0.0.yaml

  create_ecoli_msas:
    cmd: >
      bash -c 'source ~/miniforge3/etc/profile.d/conda.sh &&
      conda activate preprocessing &&
      export PYTHONPATH=$PYTHONPATH:$(pwd)/packages &&
      python -u workflows/create_msas.py
      --config "${self_path}"
      --code_hash ml_assets/data/artifacts/code_hashes/msa.hash
      --code_hash ml_assets/data/artifacts/code_hashes/create_msas.hash
      '
    deps:
      - ml_assets/data/artifacts/code_hashes/create_msas.hash
      - ml_assets/data/artifacts/code_hashes/msa.hash
      - ${hmm_config.hmm_fasta_dir}_manifest.json
      - ${self_path}
    outs:
      - ${msa_config.msa_csa_dir}_manifest.json
      - ${msa_config.msa_csa_dir}:
          persist: true
      - ml_assets/data/workflow/hashes/msa_${general.name}.json:
          persist: true
    vars:
      - ml_assets/config/preprocessing_ecoli_v1.0.0.yaml

  create_ecoli_msa_vars:
    cmd: >
      bash -c 'source ~/miniforge3/etc/profile.d/conda.sh &&
      conda activate preprocessing &&
      export PYTHONPATH=$PYTHONPATH:$(pwd)/packages &&
      python -u workflows/create_msa_variants.py
      --config "${self_path}"
      --code_hash ml_assets/data/artifacts/code_hashes/variants.hash
      --code_hash ml_assets/data/artifacts/code_hashes/create_msa_variants.hash
      '
    deps:
      - ml_assets/data/artifacts/code_hashes/variants.hash
      - ml_assets/data/artifacts/code_hashes/create_msa_variants.hash
      - ${msa_config.msa_csa_dir}_manifest.json
      - ${self_path}
    outs:
      # - ${msa_var.msa_variant_dir}/${msa_var.msa_cluster_name}_manifest.json
      - ${msa_var.msa_variant_dir}:
          persist: true
      - ml_assets/data/workflow/hashes/variants_${general.name}.json:
          persist: true
    vars:
      - ml_assets/config/preprocessing_ecoli_v1.0.0.yaml

  aggregate_ecoli_variants:
    cmd: >
      bash -c 'source ~/miniforge3/etc/profile.d/conda.sh &&
      conda activate preprocessing &&
      export PYTHONPATH=$PYTHONPATH:$(pwd)/packages &&
      python -m variants.long_table_builder
      -i ${msa_var.msa_variant_dir}/${msa_var.msa_cluster_name}
      -d ${storage.feature_db}
      -t ${features.bacteria.table_name}
      -s ${vocab.variants_encoding}
      -mp ${storage.feature_db}_bacteria_manifest.json
      '
    deps:
      - ml_assets/data/artifacts/code_hashes/variants.hash
      - ml_assets/data/artifacts/code_hashes/create_msa_variants.hash
      - ml_assets/data/workflow/hashes/variants_${general.name}.json
      - ${self_path}
    outs:
      - ${storage.feature_db}_bacteria_manifest.json
      # - ${storage.feature_db} :
      #     persist: true
    vars:
      - ml_assets/config/preprocessing_ecoli_v1.0.0.yaml

# -----------------------------------------------------------------------------
# Aggregate Training Data
# -----------------------------------------------------------------------------

  extract_interaction_matrix:
      vars:
        - ml_assets/config/interactions_v1.0.0.yaml
      cmd: >
        bash -c 'source ~/miniforge3/etc/profile.d/conda.sh &&
        conda activate preprocessing &&
        export PYTHONPATH=$PYTHONPATH:$(pwd)/packages &&
        python -m external_db_provisioning.extract_interactions
        -c ${self_path}
        '
      deps:
        - ${data_intake.source_db}
        - ${self_path}
      outs:
        - ${data_intake.output_matrix}

  build_training_data:
    vars:
      - ml_assets/config/interactions_v1.0.0.yaml
    cmd: >
      bash -c 'source ~/miniforge3/etc/profile.d/conda.sh &&
      conda activate training &&
      export PYTHONPATH=$PYTHONPATH:$(pwd)/packages:$(pwd)/workflows &&
      python -m representation.build_model_data
      -i ${data_intake.output_matrix}
      -d ${storage.feature_db}
      -o ${storage.training_data_dir}
      -f ${storage.training_data_name}
      '
    deps:
      - ${data_intake.output_matrix}
      - ${storage.feature_db}_phage_manifest.json
      - ${storage.feature_db}_bacteria_manifest.json
      - ${storage.feature_db}_serotypes.json
      - ml_assets/data/artifacts/code_hashes/build_model_data.hash
      - ml_assets/data/artifacts/code_hashes/data_contracts.hash
    outs:
      - ${storage.training_data_dir} :
          persist: true

  # feature_engineering:
  #   cmd: python packages/feature_engineering/run_feature_engineering.py \
  #           --config configs/feature_engineering.yaml \
  #           --input ml_assets/data/clean \
  #           --output ml_assets/data/features
  #   deps:
  #     - packages/feature_engineering/
  #     - ml_assets/data/clean
  #     - configs/feature_engineering.yaml
  #     - ${vocab.file}
  #   outs:
  #     - ml_assets/data/features


# -----------------------------------------------------------------------------
# Train Model
# -----------------------------------------------------------------------------

  train_model:
    vars:
      - ml_assets/config/train_v0.0.1.yaml
    cmd: >
      bash -c 'source ~/miniforge3/etc/profile.d/conda.sh &&
      conda activate training &&
      export PYTHONPATH=$PYTHONPATH:$(pwd)/packages:$(pwd)/workflows &&
      export CUDA_VISIBLE_DEVICES="" &&
      python workflows/run_train.py
      --config ml_assets/config/train_v0.0.1.yaml
      --code_hash ml_assets/data/artifacts/code_hashes/run_train.hash
      '
    deps:
      - ml_assets/config/train_v0.0.1.yaml
    outs:
      - ${experiment_tracker_dir}_manifest.json
      - ${experiment_tracker_dir}:
          persist: true


