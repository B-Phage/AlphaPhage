  prodigal_phage:
    # required:
    #   dvc add ../databases/production/sequence_data/phage --out ml_assets/data/sequence_data
    #   git add ml_assets/data/sequence_data/phage/.gitignore ml_assets/data/sequence_data/bacteria/phage.dvc
    cmd: >
      bash -c 'source ~/miniforge3/etc/profile.d/conda.sh &&
      conda activate preprocessing &&
      export PYTHONPATH=$PYTHONPATH:$(pwd)/packages &&
      python -u workflows/run_prodigal.py --config ml_assets/config/prodigal_phage_v0.0.1.yaml'
    deps:
      - workflows/run_prodigal.py
      - packages/orchestration/orchestrator.py
      - ml_assets/data/sequence_data/phage
      - params.yaml
      - ml_assets/config/prodigal_phage_v0.0.1.yaml
    outs:
      - ml_assets/data/processed/phage/proteins

  hmm_scan_all_phage:
    cmd: >
      bash -c 'source ~/miniforge3/etc/profile.d/conda.sh &&
      conda activate preprocessing &&
      python -u workflows/orchestrator/run_hmm_scan_pipeline.py --config ml_assets/config/prodigal_phage_v0.0.1.yaml'
    deps:
      - workflows/orchestrator/run_hmm_scan_pipeline.py
      - packages/hmm/search.py
      - workflows/cli/hmm_scan.py
      - ml_assets/data/processed/phage/proteins
      - ml_assets/config/prodigal_phage_v0.0.1.yaml
      - packages/data_contracts/hmm_lake.py
    outs:
      - ml_assets/data/processed/phage/hmm_scan_lake

  build_phage_hmm_summary:
    cmd: >
      bash -c 'source ~/miniforge3/etc/profile.d/conda.sh &&
      conda activate preprocessing &&
      python -u workflows/hmm_parquet_to_summary_tbl.py
      --config ml_assets/config/prodigal_phage_v0.0.1.yaml
      --fingerprint ml_assets/data/artifacts/hmm_phrog_summary.fingerprint'
    deps:
      - workflows/hmm_parquet_to_summary_tbl.py
      - packages/data_contracts/hmm_lake.py
      - packages/hmm/duckdb_io.py
      - ml_assets/data/processed/phage/hmm_scan_lake        # parquet-producing stage output
    outs:
      - ml_assets/data/artifacts/hmm_phrog_summary.fingerprint

