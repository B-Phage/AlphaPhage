[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "utils"
version = "0.0.1"
description = "Utils module for the ML pipeline"
readme = "README.md"
license = { text = "PROPRIETARY, CONFIDENTIAL" }

# Python 3.10 requirement (Conda enforces it, but it's good to specify here also)
requires-python = ">=3.10,<3.15"

# Pip-installable dependencies (Conda deps go in env.yml, not here)
dependencies = [
  # "pandas>=1.5",
  # "numpy>=1.23"
]

[tool.setuptools]
# Optional: Use src/ layout if desired
# package-dir = {"" = "src"}

# [tool.setuptools.packages.find]
# where = ["."]
# include = ["packages*"]

[tool.black]
line-length = 100
target-version = ['py38']
