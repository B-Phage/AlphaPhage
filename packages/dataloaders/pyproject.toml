[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dataloaders"
version = "0.0.1"
description = "Data laoders module for host-phage interaction."
readme = "README_training.md"
license = "LicenseRef-Proprietary"
requires-python = ">=3.10,<3.15"
dependencies = [
    "h5py"
    "torch",
    "pytorch-lightning",
    "numpy"
]

[tool.setuptools]
# leave empty unless needed

# we use the root level pyproject.toml black and isort
