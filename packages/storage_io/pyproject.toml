[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "storage_io"
version = "0.1.0"
description = "Storage input/output module for the ML pipeline"
readme = "README_storage.md"
license = "LicenseRef-Proprietary"

# Python 3.10 requirement (Conda enforces it, but it's good to specify here also)
requires-python = ">=3.10,<3.14"

[tool.setuptools]
# Add your new filename (without the .py extension) to this list
py-modules = ["parquet_lake", "parquet_inspect", "duckdb_views", "duckdb_client"]

# we use the root level pyproject.toml black and isort
