[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "preprocessing"
version = "0.1.0"
description = "Preprocessing module for the ML pipeline"
readme = "README.md"
license = "LicenseRef-Proprietary"

# Python 3.10 requirement (Conda enforces it, but it's good to specify here also)
requires-python = ">=3.10,<3.14"

[tool.setuptools]

# we use the root level pyproject.toml black and isort
