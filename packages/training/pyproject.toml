[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "training"
version = "0.0.1"
description = "Training module for host-phage interaction."
readme = "README_training.md"
license = "LicenseRef-Proprietary"
requires-python = ">=3.10,<3.15"
dependencies = [
    "hydra",
    "h5py",
    "torch",
    "pytorch-lightning",
    "numpy"]

[tool.setuptools]
# leave empty unless needed
py-modules = ["embeddings", "train", "train_utils"]

# we use the root level pyproject.toml black and isort
