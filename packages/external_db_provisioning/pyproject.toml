[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hmm"
version = "0.1.0"
description = "External database dependency preprocessing module for the ML pipeline"
readme = "README_ext_db_prov.md"
license = "LicenseRef-Proprietary"

# Python 3.10 requirement (Conda enforces it, but it's good to specify here also)
requires-python = ">=3.10,<3.14"

[tool.setuptools]
# Add your new filename (without the .py extension) to this list
py-modules = ["provisioner", "hmm_data_setup", "kaptive_data_setup"]

# we use the root level pyproject.toml black and isort
