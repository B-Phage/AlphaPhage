[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "AlphaPhage"
version = "0.0.1"
description = "Mono-repo for the ML pipeline"
readme = "README.md"
license = "LicenseRef-Proprietary"
requires-python = ">=3.10,<3.15"
dependencies = []

[tool.setuptools]

[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.pytest.ini_options]
pythonpath = ["packages"]
