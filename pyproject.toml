[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "AlphaPhage"
version = "0.0.1"
description = "Mono-repo for the ML pipeline"
readme = "README.md"
license = "LicenseRef-Proprietary"
requires-python = ">=3.10,<3.15"
dependencies = []

[tool.setuptools]

[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.pytest.ini_options]
# Automatically look for tests in these directories
testpaths = ["tests"]
# Add the packages directory to sys.path so 'import setup_workflows' works
pythonpath = ["packages"]
# Default CLI flags:
# --cov points to the code you want to track
# --cov-report ensures you see the results in the terminal
addopts = "--cov=packages --cov-report=term-missing --cov-report=xml"

[tool.coverage.run]
# This is the "magic" for your subprocess issue
# It allows coverage to track processes launched via subprocess.run
concurrency = ["multiprocessing", "thread"]
parallel = true
sigterm = true
# Ensure we only track your actual code, not library code
source = ["packages"]
# This helps combine the data from parent and child processes
relative_files = true

[tool.coverage.report]
# Shows which lines aren't covered
show_missing = true
# Ignore the boilerplate entry point in coverage percentage calculations
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError"
]
