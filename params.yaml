# DVC pipeline parameters

# These vocab settings are the single source of truth for the rest of the code base.
vocab:
  version: "v0.0.1"
  file: "ml_assets/vocab/vocab_v0.0.1.yaml"
  variants_encoding: "vocab_clusters_single"


#---------------------------------------------------
# Config DVC Runtime Staging. Used by stage_runtime_configs()
#---------------------------------------------------
phage_preprocess_conf:
  source: "ml_assets/config/preprocessing_phage_v1.0.0.yaml"
  runtime: "ml_assets/runtime_configs/phage_preprocessing.yaml" # don't change this, hardcoded in dvc.yaml

ecoli_preprocess_conf:
  source: "ml_assets/config/preprocessing_ecoli_v1.0.0.yaml"
  runtime: "ml_assets/runtime_configs/bac_preprocessing.yaml" # don't change this, hardcoded in dvc.yaml

serotype_conf:
  source: "ml_assets/config/kaptive3api_v0.0.1.yaml"
  runtime: "ml_assets/runtime_configs/serotype.yaml" # don't change this, hardcoded in dvc.yaml

train_model_conf:
  source: "ml_assets/config/train_v0.0.1.yaml"
  runtime: "ml_assets/runtime_configs/train.yaml" # don't change this, hardcoded in dvc.yaml

interactions_conf:
  source: "ml_assets/config/interactions_v1.0.0.yaml"
  runtime: "ml_assets/runtime_configs/interactions.yaml"

model:
  name: "transformer_v3"

inference:
  batch_size: 64


#---------------------------------------------------
# Processing aggregation
#---------------------------------------------------

storage:
  feature_db: "ml_assets/data/processed/aggregated/features.db"
  training_data_dir: "ml_assets/data/processed/model_training"
  training_data_name: "train_data_v1"


# Define the "Schema" of the aggregation
features:
  phage:
    table_name: "phage_variants_v1"
    vocab_key: "vocab_clusters_single"
    input_dir: "ml_assets/data/processed/phage/msa_var"
  bacteria:
    table_name: "bacteria_variants_v1"
    vocab_key: "bacteria_tokens"
    input_dir: "ml_assets/data/processed/bacteria/msa_var"
  serotype:
    table_name: "bacteria_serotypes_v1"
    input_dir: "ml_assets/data/processed/bacteria/kaptive"
