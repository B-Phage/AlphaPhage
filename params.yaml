# DVC pipeline parameters

# These vocab settings are the single source of truth for the rest of the code base.
vocab:
  version: "v0.0.1"
  file: "ml_assets/vocab/vocab_phage_tokens_v0.0.1.yaml"

prep:
  prodigal_file: "ml_assets/config/prodigal_v0.0.1.yaml"


feature_engineering:
  method: "default"

kapsid:
  kapsid_config: "ml_assets/config/kapsid3_config.yaml"

model:
  name: "transformer_v3"

inference:
  batch_size: 64

phage_config:  ml_assets/config/prodigal_phage_v0.0.1.yaml

train:
  train_config: "ml_assets/config/train_v0.0.1.yaml"
