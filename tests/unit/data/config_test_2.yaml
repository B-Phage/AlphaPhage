# train_labels_path : "tests/data/cl_Test_50_50_TOK_test_AT_cond2_unaligned_test_binary_pairkey.h5"
debug_features_path : ""
debug_labels_path : ""

pair_indices_name : "pair_indices"
dataset_name_host : "host_vec_1"
dataset_name_phage : "phage_vec_1"
reader_mode : "binary_pairkey"
architecture : "TransformerX"
num_workers : 0

trainer:
  logger_method : "DVCLiveLogger"
  project : "AlphaPhage_Testing"
  run_name : "test_run_2"
  mlflow_tracking_uri : null
  epochs : 300
  accelerator : "cpu"
  devices : 1
  precision : 32
  batch_size : 10
  save_top_k : 3
  patience : 5
  val_fraction : 0.15

hyp:
  # archspec : "rope_nt_nonormpostl_sum"
  archspec : "nope_tt_nonormpostl_cls"
  archspec2 : "L4_bn"
  # archspec2 : "invalid_call"
  # archspec2 : invalid_n
  dim : 8
  lcom : 30
  dim1 : 8
  dim2 : 8
  heads : 4
  mult : 4
  depth : 1
  # depth : 0
  vocab_size_out : 2

optimizer:
  lr : 0.001
