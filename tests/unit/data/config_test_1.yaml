seed  : 42
verboselevel : "ERROR"
debug_mode : false

train_features_path : "../../bp/databases/process/train_data/x_TOK_all.rfNone.trainval.hmms_types_t100h_t100p_msa.h5"
train_labels_path : "../../bp/databases/process/train_data/cl_TOK_all.rfNone.trainval.hmms_types_t100h_t100p_msa.h5"
debug_features_path : "../../bp/AlphaPhage/tests/unit/data/debug_features.h5"
debug_labels_path : "../../bp/AlphaPhage/tests/unit/data/debug_labels.h5"

pair_indices_name : "pair_indices"
dataset_name_host : "host_vec_1"
dataset_name_phage : "phage_vec_1"
reader_mode : "binary_pairkey"
architecture : "TransformerX"
num_workers : 0

trainer:
  epochs : 10
  accelerator : "cpu"
  devices : 1
  precision : 32
  batch_size : 3
  save_top_k : 3
  patience : 5
  val_fraction : 0.2

hyp:
  archspec : "nope_nt_nonormpostl_sum"
  archspec2 : "L4_bn"
  dim : 8
  lcom : 30
  dim1 : 8
  dim2 : 8
  heads : 4
  mult : 4
  depth : 1
  vocab_size_out : 2

optimizer:
  lr : 0.001
